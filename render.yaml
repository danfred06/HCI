# Render Blueprint for HCI / "My Blue App"
#
# Deploy: Render Dashboard -> New -> Blueprint -> connect
#   https://github.com/danfred06/HCI.git  (branch: main)
#
# The service names below determine the public URLs:
#   API       https://hci-blue-app-api.onrender.com
#   Frontend  https://hci-blue-app.onrender.com
# If you rename a service, update APP_URL, FRONTEND_URL and VITE_API_URL too.

databases:
  - name: hci-blue-app-db
    databaseName: hci_blue_app
    user: hci_blue_app
    plan: free

services:
  # ---------------------------------------------------------------------------
  # Laravel 12 REST API (Sanctum personal access tokens)
  # PHP has no native Render runtime, so this is built from backend/Dockerfile.
  # The image is pinned to a PHP2Shell-patched PHP release (8.4.27).
  # ---------------------------------------------------------------------------
  - type: web
    name: hci-blue-app-api
    plan: free
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: My Blue App
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Render generates a 256-bit base64 secret; the deploy script adds the
      # "base64:" prefix that Laravel expects.
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://hci-blue-app-api.onrender.com
      - key: FRONTEND_URL
        value: https://hci-blue-app.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      # config/database.php reads DB_URL and Render's connection string already
      # carries SSL settings, so no manual host/port credentials are needed.
      - key: DB_URL
        fromDatabase:
          name: hci-blue-app-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: public
      - key: APP_MAINTENANCE_DRIVER
        value: file

  # ---------------------------------------------------------------------------
  # React + Vite single-page app (static build, served over Render's CDN)
  # ---------------------------------------------------------------------------
  - type: web
    name: hci-blue-app
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Vite inlines this at BUILD time. Must point at the API service above.
      - key: VITE_API_URL
        value: https://hci-blue-app-api.onrender.com/api
    # React Router deep links (e.g. /dashboard) need index.html. Render serves
    # real files first, so this only kicks in for client-side routes.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
